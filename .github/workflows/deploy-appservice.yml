name: deploy-appservice

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which app to deploy"
        type: choice
        default: all
        options: [all, api, web]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: build-ai-app-env
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_SERVICE_PLAN: ${{ vars.AZURE_APP_SERVICE_PLAN }}
      AZURE_API_APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
      AZURE_WEB_APP_NAME: ${{ vars.AZURE_WEB_APP_NAME }}
      API_HOSTNAME: ${{ vars.API_HOSTNAME }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_AGENT_ID: ${{ vars.FOUNDRY_AGENT_ID }}
      FOUNDRY_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_FQDN: ${{ vars.POSTGRES_FQDN }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_ADMIN_USER: ${{ vars.POSTGRES_ADMIN_USER }}
      STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
      STORAGE_CONTAINER: ${{ vars.STORAGE_CONTAINER }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure CLI (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment settings
        run: |
          RESOURCE_GROUP="${AZURE_RESOURCE_GROUP:-rg-mmaug-agent-service}"
          APP_SERVICE_PLAN="${AZURE_APP_SERVICE_PLAN:-plan-mmaug-meetup-0217}"
          API_APP_NAME="${AZURE_API_APP_NAME:-app-api-mmaug-meetup-0217}"
          WEB_APP_NAME="${AZURE_WEB_APP_NAME:-app-web-mmaug-meetup-0217}"
          API_BASE_HOST="${API_HOSTNAME:-${API_APP_NAME}.azurewebsites.net}"

          echo "RESOURCE_GROUP=$RESOURCE_GROUP" >> "$GITHUB_ENV"
          echo "APP_SERVICE_PLAN=$APP_SERVICE_PLAN" >> "$GITHUB_ENV"
          echo "API_APP_NAME=$API_APP_NAME" >> "$GITHUB_ENV"
          echo "WEB_APP_NAME=$WEB_APP_NAME" >> "$GITHUB_ENV"
          echo "API_BASE_HOST=$API_BASE_HOST" >> "$GITHUB_ENV"

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "${AZURE_LOCATION:-swedencentral}" \
            --tags project=mmaug-foundry-support event=mmaug-meetup

      - name: Ensure App Service plan exists
        run: |
          if ! az appservice plan show --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_PLAN" >/dev/null 2>&1; then
            az appservice plan create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_SERVICE_PLAN" \
              --is-linux \
              --sku B3
          fi

      - name: Ensure target web apps exist
        run: |
          if [ "${{ inputs.target }}" != "web" ] && ! az webapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" >/dev/null 2>&1; then
            az webapp create \
              --resource-group "$RESOURCE_GROUP" \
              --plan "$APP_SERVICE_PLAN" \
              --name "$API_APP_NAME"

            az webapp config set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$API_APP_NAME" \
              --linux-fx-version "PYTHON|3.11"
          fi

          if [ "${{ inputs.target }}" != "api" ] && ! az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME" >/dev/null 2>&1; then
            az webapp create \
              --resource-group "$RESOURCE_GROUP" \
              --plan "$APP_SERVICE_PLAN" \
              --name "$WEB_APP_NAME" \
              --runtime "NODE:24-lts"

            az webapp config set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$WEB_APP_NAME" \
              --linux-fx-version "NODE|24-lts"
          fi

      - name: Verify target web apps exist
        run: |
          if [ "${{ inputs.target }}" != "web" ]; then
            az webapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" >/dev/null
          fi

          if [ "${{ inputs.target }}" != "api" ]; then
            az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME" >/dev/null
          fi

      - name: Set up Python 3.11
        if: ${{ inputs.target == 'all' || inputs.target == 'api' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend imports
        if: ${{ inputs.target == 'all' || inputs.target == 'api' }}
        working-directory: backend
        env:
          FOUNDRY_PROJECT_ENDPOINT: https://example.invalid/api/projects/x
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          STORAGE_ACCOUNT_NAME: ci
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from app.main import app; print('imports ok:', app.title)"

      - name: Package backend
        if: ${{ inputs.target == 'all' || inputs.target == 'api' }}
        run: |
          rm -rf /tmp/backend-package
          mkdir -p /tmp/backend-package
          cp -R backend/app /tmp/backend-package/app
          cp backend/requirements.txt /tmp/backend-package/requirements.txt
          cp backend/startup.sh /tmp/backend-package/startup.sh
          chmod +x /tmp/backend-package/startup.sh
          cd /tmp/backend-package
          zip -r /tmp/backend.zip .

      - name: Configure backend startup
        if: ${{ inputs.target == 'all' || inputs.target == 'api' }}
        run: |
          RESOLVED_POSTGRES_HOST="${POSTGRES_HOST:-$POSTGRES_FQDN}"
          RESOLVED_POSTGRES_PORT="${POSTGRES_PORT:-5432}"
          RESOLVED_POSTGRES_DB="${POSTGRES_DB:-support}"
          RESOLVED_POSTGRES_USER="${POSTGRES_USER:-$POSTGRES_ADMIN_USER}"
          RESOLVED_STORAGE_CONTAINER="${STORAGE_CONTAINER:-attachments}"
          RESOLVED_CORS_ORIGINS="${CORS_ORIGINS:-https://${WEB_APP_NAME}.azurewebsites.net}"
          RESOLVED_MODEL_DEPLOYMENT="${FOUNDRY_MODEL_DEPLOYMENT:-gpt-4o-mini}"

          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --startup-file "bash startup.sh"

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              WEBSITES_PORT=8000 \
              WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
              PYTHONUNBUFFERED=1 \
              FOUNDRY_PROJECT_ENDPOINT="$FOUNDRY_PROJECT_ENDPOINT" \
              FOUNDRY_AGENT_ID="$FOUNDRY_AGENT_ID" \
              FOUNDRY_MODEL_DEPLOYMENT="$RESOLVED_MODEL_DEPLOYMENT" \
              POSTGRES_HOST="$RESOLVED_POSTGRES_HOST" \
              POSTGRES_PORT="$RESOLVED_POSTGRES_PORT" \
              POSTGRES_DB="$RESOLVED_POSTGRES_DB" \
              POSTGRES_USER="$RESOLVED_POSTGRES_USER" \
              POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              POSTGRES_SSLMODE=require \
              STORAGE_ACCOUNT_NAME="$STORAGE_ACCOUNT_NAME" \
              STORAGE_CONTAINER="$RESOLVED_STORAGE_CONTAINER" \
              CORS_ORIGINS="$RESOLVED_CORS_ORIGINS"

      - name: Deploy backend
        if: ${{ inputs.target == 'all' || inputs.target == 'api' }}
        run: |
          az webapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --src /tmp/backend.zip

      - name: Set up Node 20
        if: ${{ inputs.target == 'all' || inputs.target == 'web' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build frontend
        if: ${{ inputs.target == 'all' || inputs.target == 'web' }}
        working-directory: frontend
        env:
          VITE_API_BASE: https://${{ env.API_BASE_HOST }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package frontend
        if: ${{ inputs.target == 'all' || inputs.target == 'web' }}
        run: |
          cd frontend/dist
          zip -r /tmp/frontend.zip .

      - name: Deploy frontend
        if: ${{ inputs.target == 'all' || inputs.target == 'web' }}
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITES_PORT=8080 \
              WEBSITE_NODE_DEFAULT_VERSION="~24"

          az webapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --src /tmp/frontend.zip
