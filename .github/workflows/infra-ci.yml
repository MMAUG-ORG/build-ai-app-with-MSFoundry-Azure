name: infra-ci

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  workflow_dispatch:

jobs:
  bicep-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Bicep build (compile + lint)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Format check
        run: az bicep format --file infra/main.bicep --stdout > /dev/null
