name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app

      - name: Import-check (ensures app is wired correctly)
        env:
          FOUNDRY_PROJECT_ENDPOINT: https://example.invalid/api/projects/x
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          STORAGE_ACCOUNT_NAME: ci
        run: python -c "from app.main import app; print('imports ok:', app.title)"
