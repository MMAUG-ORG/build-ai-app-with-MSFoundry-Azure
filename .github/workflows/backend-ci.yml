name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app

      - name: Import-check (ensures app is wired correctly)
        env:
          FOUNDRY_PROJECT_ENDPOINT: https://example.invalid/api/projects/x
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          STORAGE_ACCOUNT_NAME: ci
        run: python -c "from app.main import app; print('imports ok:', app.title)"

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    needs: lint-and-test
    runs-on: ubuntu-latest
    environment: build-ai-app-env
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_SERVICE_PLAN: ${{ vars.AZURE_APP_SERVICE_PLAN }}
      AZURE_API_APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure CLI (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment settings
        run: |
          RESOURCE_GROUP="${AZURE_RESOURCE_GROUP:-rg-mmaug-agent-service}"
          APP_SERVICE_PLAN="${AZURE_APP_SERVICE_PLAN:-plan-mmaug-meetup-0217}"
          API_APP_NAME="${AZURE_API_APP_NAME:-app-api-mmaug-meetup-0217}"

          echo "RESOURCE_GROUP=$RESOURCE_GROUP" >> "$GITHUB_ENV"
          echo "APP_SERVICE_PLAN=$APP_SERVICE_PLAN" >> "$GITHUB_ENV"
          echo "API_APP_NAME=$API_APP_NAME" >> "$GITHUB_ENV"

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "${AZURE_LOCATION:-swedencentral}" \
            --tags project=mmaug-foundry-support event=mmaug-meetup

      - name: Ensure App Service plan exists
        run: |
          if ! az appservice plan show --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_PLAN" >/dev/null 2>&1; then
            az appservice plan create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_SERVICE_PLAN" \
              --is-linux \
              --sku B3
          fi

      - name: Ensure backend app exists
        run: |
          if ! az webapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" >/dev/null 2>&1; then
            az webapp create \
              --resource-group "$RESOURCE_GROUP" \
              --plan "$APP_SERVICE_PLAN" \
              --name "$API_APP_NAME" \
              --runtime "PYTHON:3.11"
          fi

      - name: Verify backend app exists
        run: az webapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" >/dev/null

      - name: Package backend
        run: |
          rm -rf /tmp/backend-package
          mkdir -p /tmp/backend-package
          cp -R backend/app /tmp/backend-package/app
          cp backend/requirements.txt /tmp/backend-package/requirements.txt
          cp backend/startup.sh /tmp/backend-package/startup.sh
          chmod +x /tmp/backend-package/startup.sh
          cd /tmp/backend-package
          zip -r /tmp/backend.zip .

      - name: Configure backend startup
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --startup-file "bash startup.sh"

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              WEBSITES_PORT=8000 \
              WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
              PYTHONUNBUFFERED=1

      - name: Deploy backend
        run: |
          az webapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --src /tmp/backend.zip
