name: deploy-azd

# End-to-end deployment via Azure Developer CLI using OIDC federated credentials
# (no client secret stored). Triggered manually so it does not run on every push.
#
# Required GitHub variables (Settings → Secrets and variables → Actions → Variables):
#   AZURE_CLIENT_ID        - app registration / managed identity used for OIDC
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   AZURE_ENV_NAME         - azd environment name, e.g. "mmaug-foundry-prod"
#   AZURE_LOCATION         - e.g. "westeurope"
#
# Required GitHub secret:
#   POSTGRES_ADMIN_PASSWORD - strong password for the Postgres Flexible admin

on:
  workflow_dispatch:
    inputs:
      action:
        description: "azd command to run"
        type: choice
        default: up
        options: [up, deploy, provision]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  azd:
    runs-on: ubuntu-latest
    environment: build-ai-app-env
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_HOSTNAME: ${{ vars.API_HOSTNAME }}
      WEB_HOSTNAME: ${{ vars.WEB_HOSTNAME }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure CLI (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in to Azure (OIDC, federated credential)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Run azd ${{ inputs.action }}
        run: |
          azd env new "$AZURE_ENV_NAME" \
            --location "$AZURE_LOCATION" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --no-prompt 2>/dev/null || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_PRINCIPAL_ID "$AZURE_PRINCIPAL_ID"
          azd env set POSTGRES_ADMIN_PASSWORD "$POSTGRES_ADMIN_PASSWORD"

          if [ "${{ inputs.action }}" = "deploy" ]; then
            RESOURCE_GROUP="${AZURE_RESOURCE_GROUP:-rg-rg-mmaug-agent}"
            API_HOST="${API_HOSTNAME:-app-api-mmaug-meetup-0217.azurewebsites.net}"
            WEB_HOST="${WEB_HOSTNAME:-app-web-mmaug-meetup-0217.azurewebsites.net}"

            azd env set AZURE_RESOURCE_GROUP "$RESOURCE_GROUP"
            azd env set API_HOSTNAME "$API_HOST"
            azd env set WEB_HOSTNAME "$WEB_HOST"

            az webapp update \
              --resource-group "$RESOURCE_GROUP" \
              --name "${API_HOST%%.*}" \
              --set tags.azd-service-name=api tags.azd-env-name="$AZURE_ENV_NAME"

            az webapp update \
              --resource-group "$RESOURCE_GROUP" \
              --name "${WEB_HOST%%.*}" \
              --set tags.azd-service-name=web tags.azd-env-name="$AZURE_ENV_NAME"
          fi

          azd ${{ inputs.action }} --no-prompt

          if [ "${{ inputs.action }}" = "deploy" ]; then
            eval "$(azd env get-values)"
            az webapp config set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "${API_HOSTNAME%%.*}" \
              --startup-file "bash startup.sh"
          fi
