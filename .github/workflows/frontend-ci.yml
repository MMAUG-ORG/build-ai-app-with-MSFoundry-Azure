name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          VITE_API_BASE: http://localhost:8000
        run: npm run build

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    environment: build-ai-app-env
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_SERVICE_PLAN: ${{ vars.AZURE_APP_SERVICE_PLAN }}
      AZURE_WEB_APP_NAME: ${{ vars.AZURE_WEB_APP_NAME }}
      API_HOSTNAME: ${{ vars.API_HOSTNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure CLI (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment settings
        run: |
          RESOURCE_GROUP="${AZURE_RESOURCE_GROUP:-rg-mmaug-agent-service}"
          APP_SERVICE_PLAN="${AZURE_APP_SERVICE_PLAN:-plan-mmaug-meetup-0217}"
          WEB_APP_NAME="${AZURE_WEB_APP_NAME:-app-web-mmaug-meetup-0217}"
          API_BASE_HOST="${API_HOSTNAME:-app-api-mmaug-meetup-0217.azurewebsites.net}"

          echo "RESOURCE_GROUP=$RESOURCE_GROUP" >> "$GITHUB_ENV"
          echo "APP_SERVICE_PLAN=$APP_SERVICE_PLAN" >> "$GITHUB_ENV"
          echo "WEB_APP_NAME=$WEB_APP_NAME" >> "$GITHUB_ENV"
          echo "API_BASE_HOST=$API_BASE_HOST" >> "$GITHUB_ENV"

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "${AZURE_LOCATION:-swedencentral}" \
            --tags project=mmaug-foundry-support event=mmaug-meetup

      - name: Ensure App Service plan exists
        run: |
          if ! az appservice plan show --resource-group "$RESOURCE_GROUP" --name "$APP_SERVICE_PLAN" >/dev/null 2>&1; then
            az appservice plan create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_SERVICE_PLAN" \
              --is-linux \
              --sku B3
          fi

      - name: Ensure frontend app exists
        run: |
          if ! az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME" >/dev/null 2>&1; then
            az webapp create \
              --resource-group "$RESOURCE_GROUP" \
              --plan "$APP_SERVICE_PLAN" \
              --name "$WEB_APP_NAME" \
              --runtime "NODE:24-lts"

            az webapp config set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$WEB_APP_NAME" \
              --linux-fx-version "NODE|24-lts"
          fi

      - name: Verify frontend app exists
        run: az webapp show --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME" >/dev/null

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: https://${{ env.API_BASE_HOST }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package frontend
        run: |
          cd frontend/dist
          zip -r /tmp/frontend.zip .

      - name: Deploy frontend
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITES_PORT=8080 \
              WEBSITE_NODE_DEFAULT_VERSION="~24"

          az webapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --src /tmp/frontend.zip
